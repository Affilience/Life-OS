<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <!-- iOS PWA/Capacitor meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascnd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Ascnd - Level up your life" />
    <meta name="author" content="Ascnd" />
    <meta name="theme-color" content="#0c0a10" />

    <!-- Resource hints for faster loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts - Using font-display: swap for better perceived performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Inline critical CSS for faster first paint -->
    <style>
      /* Critical CSS - immediate render */
      *{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0a10;color:#fff;min-height:100vh}
      #root{min-height:100vh}
      /* Loading screen placeholder */
      .loading-placeholder{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0c0a10}
      @keyframes pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    </style>

    <title>Ascnd - Level up your life</title>
  </head>
  <body>
    <div id="root">
      <!-- Placeholder shown while JS loads -->
      <div class="loading-placeholder">
        <img src="/logo.png" alt="Ascnd" style="width: 80px; height: auto; filter: drop-shadow(0 0 20px rgba(167,139,250,0.5)); animation: pulse 2s ease-in-out infinite;" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
